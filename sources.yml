# Single source of truth for this index.
# README.md and skills/*/README.md are GENERATED from this file — do not hand-edit them.
#   python3 scripts/build.py          regenerate all docs
#   python3 scripts/check_drift.py    check pointers against upstream

meta:
  title: Mosofin Skills Index
  tagline: A graded, continuously-verified index of agent skills for accounting and finance.
  regrade_after_days: 180
  tiers_doc: docs/TRUST-TIERS.md

stages:
  0: {name: "Setup", note: "Once per client, before any close"}
  1: {name: "Orchestration", note: "Tracks the period, runs nothing itself"}
  2: {name: "Data hygiene", note: "Before the books can be trusted"}
  3: {name: "Reconcile", note: "Tie the books to the outside world"}
  4: {name: "Adjust", note: "Move amounts into the period they belong to"}
  5: {name: "Review", note: "The skeptical second pass"}
  6: {name: "Report", note: "Make the close legible to someone else"}
  7: {name: "Forward-looking", note: "After the period is shut"}

skills:

  - id: onboard-client
    title: Onboard Client
    origin: mosofin-workspace
    authority: first-party
    stage: 0
    summary: >-
      Interviews you about a company and scaffolds the client workspace every other
      finance skill reads — profile, glossary, chart-of-accounts rulebook, close
      calendar, materiality thresholds, report preferences.
    tiers: [READ-ONLY, HUMAN-APPROVAL, POLICY-CAPTURING, AUDIT-TRAIL]
    tier_notes:
      READ-ONLY: "Reads company profile and chart of accounts; writes only local workspace files."
      HUMAN-APPROVAL: "Shows drafts of every file and waits for edits before writing."
      POLICY-CAPTURING: "Accounting-policy decisions become ADR-format records in docs/decisions/."
    systems: [quickbooks, csv]
    inputs:
      - {name: "company.profile", required: false, source: "integration manifest", fallback: "ask the user"}
      - {name: "accounts.list-chart", required: false, source: "integration manifest", fallback: "chart of accounts export; else build from interview alone"}
      - {name: "workspace mode", required: true, source: "`## Finance skills` block in CLAUDE.md / AGENTS.md", fallback: "ask — single-business vs multi-client"}
      - {name: "your answers", required: true, source: "interview, one question at a time", fallback: "none — this skill is the interview"}
    outputs:
      - {name: "PROFILE.md", type: "markdown", dest: "client workspace root or clients/<name>/"}
      - {name: "CONTEXT.md", type: "markdown", dest: "client workspace — the per-client finance glossary"}
      - {name: "COA.md", type: "markdown", dest: "client workspace — account purposes and categorization rules"}
      - {name: "CLOSE-CALENDAR.md", type: "markdown", dest: "client workspace"}
      - {name: "MATERIALITY.md", type: "markdown", dest: "client workspace"}
      - {name: "REPORT-PREFS.md", type: "markdown", dest: "client workspace"}
      - {name: "decision records", type: "markdown (ADR)", dest: "docs/decisions/ — created lazily"}
      - {name: "CLIENTS.md", type: "markdown", dest: "workspace root, multi-client mode only"}
    never:
      - "Change the chart of accounts in the accounting system — it produces the rulebook, you apply edits."
    upstream: {local: "~/.claude/skills/onboard-client"}
    license: proprietary-mosofin
    mirror: false
    last_graded: "2026-09-18"
    status: GRADED

  - id: grill-my-coa
    title: Grill My COA
    origin: mosofin-workspace
    authority: first-party
    stage: 0
    summary: >-
      Relentless interview about your chart of accounts until every account has one
      clear purpose and every recurring transaction has exactly one home. Queries the
      ledger instead of asking whenever the ledger can answer.
    tiers: [READ-ONLY, EVIDENCE-GATED, HUMAN-APPROVAL, POLICY-CAPTURING]
    tier_notes:
      EVIDENCE-GATED: "Surfaces where posted reality contradicts stated account purpose, rather than accepting the stated purpose."
      READ-ONLY: "Chart edits happen in the accounting system, by you. This session produces the rulebook and an edit list."
    systems: [quickbooks, csv]
    inputs:
      - {name: "accounts.list-chart", required: false, source: "integration manifest", fallback: "chart of accounts export"}
      - {name: "ledger.gl-detail", required: false, source: "integration manifest", fallback: "your answers alone — flags that reality-checks were skipped"}
      - {name: "COA.md / CONTEXT.md", required: false, source: "client workspace", fallback: "created as you go"}
    outputs:
      - {name: "COA.md", type: "markdown (updated inline, not batched)", dest: "client workspace — purpose line, rule, `_Not_:` warning per account"}
      - {name: "CONTEXT.md", type: "markdown", dest: "client workspace — new or sharpened terms"}
      - {name: "chart edit list", type: "list", dest: "chat — renames, merges, deactivations for you to apply"}
      - {name: "decision records", type: "markdown (ADR)", dest: "docs/decisions/ — for hard-to-reverse structural changes"}
    never:
      - "Rename, merge, or deactivate accounts in the accounting system."
    upstream: {local: "~/.claude/skills/grill-my-coa"}
    license: proprietary-mosofin
    mirror: false
    last_graded: "2026-09-18"
    status: GRADED

  - id: close
    title: Close
    origin: mosofin-workspace
    authority: first-party
    stage: 1
    summary: >-
      A stateful month-end checklist for one period. Generates tasks from the client's
      close calendar, tracks status across sessions, and names the skill that fits the
      next open task. Tracks and suggests — it runs nothing and posts nothing.
    tiers: [READ-ONLY, STATEFUL, AUDIT-TRAIL, HUMAN-APPROVAL, TIE-CHECKED]
    tier_notes:
      STATEFUL: "Re-reads CHECKLIST.md fresh each session; if conversation and checklist disagree, the checklist wins."
      TIE-CHECKED: "A task with a tie-check is only done when that check was green — 'ran it' is not 'tied'."
      HUMAN-APPROVAL: "Never invokes another skill. You pick and run every step."
    systems: [any]
    inputs:
      - {name: "period", required: true, source: "argument (YYYY-MM)", fallback: "most recent unclosed month"}
      - {name: "CLOSE-CALENDAR.md", required: true, source: "client workspace", fallback: "none — stops and suggests /onboard-client"}
      - {name: "closes/<YYYY-MM>/CHECKLIST.md", required: false, source: "close workspace", fallback: "generated on first run"}
      - {name: "evidence artifacts", required: false, source: "closes/<YYYY-MM>/ — rec proofs, tie-out schedules, flux commentary", fallback: "you report task status verbally"}
    outputs:
      - {name: "CHECKLIST.md", type: "markdown", dest: "closes/<YYYY-MM>/ — tasks, status, due dates, evidence links"}
      - {name: "status report", type: "chat", dest: "done / in progress / blocked, with dates relative to today"}
      - {name: "next-move shortlist", type: "chat", dest: "open tasks whose dependencies are met, each named to a skill"}
      - {name: "close summary", type: "markdown", dest: "adjustments posted, items carried forward, accepted exceptions with a why"}
    never:
      - "Run another skill."
      - "Post an entry."
    upstream: {local: "~/.claude/skills/close"}
    license: proprietary-mosofin
    mirror: false
    last_graded: "2026-09-18"
    status: GRADED

  - id: categorize-transactions
    title: Categorize Transactions
    origin: mosofin-workspace
    authority: first-party
    stage: 2
    summary: >-
      Clears uncategorized buckets using the client's own COA rules — never guesses.
      Every proposal carries a one-word basis (rule / history / unsure), and an
      "unsure" left uncategorized is the correct outcome.
    tiers: [PROPOSES-WRITES, EVIDENCE-GATED, HUMAN-APPROVAL, MATERIALITY-AWARE, DETERMINISTIC-MATH, POLICY-CAPTURING]
    tier_notes:
      PROPOSES-WRITES: "Applies categorizations only after batch confirmation; without the write capability it emits a CSV for manual import."
      EVIDENCE-GATED: "Stops entirely if no COA.md exists — categorizing without rules is guessing."
      DETERMINISTIC-MATH: "Counts and totals computed by awk/python3 over the CSV, never mental math."
    systems: [quickbooks, csv]
    inputs:
      - {name: "transactions.list-uncategorized", required: true, source: "integration manifest", fallback: "CSV export of uncategorized transactions"}
      - {name: "COA.md", required: true, source: "client workspace", fallback: "none — stops and suggests /onboard-client"}
      - {name: "accounts.list-chart", required: false, source: "integration manifest", fallback: "rely on COA.md alone"}
      - {name: "MATERIALITY.md", required: false, source: "client workspace", fallback: "no uncategorized-at-close threshold applied"}
    outputs:
      - {name: "applied categorizations", type: "ledger writes", dest: "accounting system — confirmed batches only, then re-queried to verify the bucket shrank by exactly the applied count"}
      - {name: "categorization-<period>.csv", type: "csv", dest: "client workspace — txn id, date, payee, amount, target account (when no write capability)"}
      - {name: "new rules", type: "markdown", dest: "COA.md — written inline as overrides reveal them, not batched"}
      - {name: "tie-check", type: "chat", dest: "count + total categorized by account; count + total still uncategorized vs threshold"}
    never:
      - "Propose a category on vibes when no rule and no history exist."
    upstream: {local: "~/.claude/skills/categorize-transactions"}
    license: proprietary-mosofin
    mirror: false
    last_graded: "2026-09-18"
    status: GRADED

  - id: bank-rec
    title: Bank Rec
    origin: mosofin-workspace
    authority: first-party
    stage: 3
    summary: >-
      Reconciles one bank or credit-card account for one period. Matches statement
      lines against ledger transactions with a deterministic script; the script's
      leftovers are the work list. Done means the difference is zero, computed.
    tiers: [PROPOSES-WRITES, DETERMINISTIC-MATH, TIE-CHECKED, HUMAN-APPROVAL, AUDIT-TRAIL]
    tier_notes:
      DETERMINISTIC-MATH: "scripts/match.py does exact-amount, one-to-one matching within a date window. No matching by hand."
      TIE-CHECKED: "Red until statement closing − ledger balance − outstanding items ± unposted adjustments = zero."
      PROPOSES-WRITES: "Posts adjustments only via ledger.create-journal-entry after confirmation; otherwise emits drafts."
    systems: [quickbooks, csv]
    inputs:
      - {name: "banking.fetch-statement", required: true, source: "integration manifest", fallback: "statement CSV for the account and period"}
      - {name: "transactions.list-by-account", required: true, source: "integration manifest", fallback: "transaction detail export, same account and period"}
      - {name: "ledger.create-journal-entry", required: false, source: "integration manifest", fallback: "adjustment drafts for manual entry"}
      - {name: "COA.md", required: false, source: "client workspace", fallback: "ask for the category on proposed entries"}
      - {name: "CLOSE-CALENDAR.md", required: false, source: "client workspace", fallback: "you pick the account order"}
    outputs:
      - {name: "reconciliation proof", type: "markdown", dest: "closes/<YYYY-MM>/ — balances, matched count and total, each exception and its resolution"}
      - {name: "exception work list", type: "chat", dest: "classified timing / missing-from-books / missing-from-bank / error / unknown"}
      - {name: "adjustment entries", type: "journal entries or drafts", dest: "accounting system after confirmation, else draft file"}
      - {name: "stale-item flags", type: "chat", dest: "uncleared >90 days, flagged for voiding"}
    never:
      - "Assert a zero difference. It is computed by the script or it is red."
      - "Guess at an unmatched item — 'unknown' is a question, not a classification."
    upstream: {local: "~/.claude/skills/bank-rec"}
    license: proprietary-mosofin
    mirror: false
    last_graded: "2026-09-18"
    status: GRADED

  - id: aging-review
    title: Aging Review
    origin: mosofin-workspace
    authority: first-party
    stage: 3
    summary: >-
      Walks A/R and A/P aging oldest-first — flags overdue, stale, duplicate, and
      credit-balance items, then drafts collections notes and a proposed payment run.
      Cross-foots the aging to the ledger before any of it is believed.
    tiers: [READ-ONLY, DETERMINISTIC-MATH, TIE-CHECKED, HUMAN-APPROVAL, CLIENT-FACING, NO-AUTO-SEND, AUDIT-TRAIL]
    tier_notes:
      TIE-CHECKED: "Bucket totals must sum to the report total and tie to the balance-sheet A/R or A/P balance. Red until tied."
      NO-AUTO-SEND: "Collections notes are drafts. You send them."
      READ-ONLY: "Items needing accounting action are noted for /accruals or /je-review — suggested, never invoked."
    systems: [quickbooks, csv]
    inputs:
      - {name: "ar.aging", required: true, source: "integration manifest", fallback: "A/R aging summary export"}
      - {name: "ap.aging", required: true, source: "integration manifest", fallback: "A/P aging summary export"}
      - {name: "ar.open-invoices", required: false, source: "integration manifest", fallback: "work from the aging summary only"}
      - {name: "ap.open-bills", required: false, source: "integration manifest", fallback: "work from the aging summary only"}
      - {name: "PROFILE.md / CONTEXT.md", required: false, source: "client workspace — terms, related-party watch-outs", fallback: "ask once"}
      - {name: "REPORT-PREFS.md", required: false, source: "client workspace — voice for draft notes", fallback: "ask once"}
    outputs:
      - {name: "collections notes", type: "draft text", dest: "chat — one per overdue customer, in the client's voice"}
      - {name: "proposed payment run", type: "list", dest: "chat — due now / due soon / hold-and-why, for your approval"}
      - {name: "flag summary", type: "markdown", dest: "closes/<YYYY-MM>/ — flagged vs clean by bucket, plus aging-to-ledger tie status"}
    never:
      - "Send a collections note."
      - "Guess at a dispute or a counterparty relationship."
    upstream: {local: "~/.claude/skills/aging-review"}
    license: proprietary-mosofin
    mirror: false
    last_graded: "2026-09-18"
    status: GRADED

  - id: accruals
    title: Accruals
    origin: mosofin-workspace
    authority: first-party
    stage: 4
    summary: >-
      Proposes and reviews accruals, prepaid amortization, and deferrals for a period —
      recurring accruals, reversals due, missing accruals from open bills, schedule
      releases. Accrual basis only; stops on cash basis.
    tiers: [PROPOSES-WRITES, DETERMINISTIC-MATH, TIE-CHECKED, HUMAN-APPROVAL, MATERIALITY-AWARE, POLICY-CAPTURING, AUDIT-TRAIL]
    tier_notes:
      MATERIALITY-AWARE: "Below the accruals threshold, book-when-paid is the documented policy — stated as policy, not silence."
      TIE-CHECKED: "Every entry balances; prepaid and deferral schedules must roll (opening + additions − releases = closing) against account balances."
      DETERMINISTIC-MATH: "Amounts show their arithmetic source — contract ÷ term, prior actuals — scripted beyond a single division."
    systems: [quickbooks, csv]
    inputs:
      - {name: "ledger.gl-detail", required: true, source: "integration manifest", fallback: "GL detail export, this and prior period"}
      - {name: "ap.open-bills", required: false, source: "integration manifest", fallback: "ask whether known unbilled expenses exist"}
      - {name: "accounts.balances-as-of", required: false, source: "integration manifest", fallback: "ask for prepaid / deferral balances"}
      - {name: "ledger.create-journal-entry", required: false, source: "integration manifest", fallback: "formatted JE drafts for manual entry"}
      - {name: "PROFILE.md", required: true, source: "client workspace — accounting method", fallback: "ask; cash basis means this skill does not apply"}
      - {name: "MATERIALITY.md", required: false, source: "client workspace — accruals threshold", fallback: "ask once"}
      - {name: "docs/decisions/", required: false, source: "client workspace — revenue recognition policy", fallback: "offers to record one when a recurring judgment has none"}
    outputs:
      - {name: "posted entries", type: "journal entries", dest: "accounting system — confirmed batches only"}
      - {name: "JE draft file", type: "markdown/csv", dest: "closes/<YYYY-MM>/ — date, memo, lines, reversal instruction"}
      - {name: "roll-forward proof", type: "chat + artifact", dest: "booked / drafted / skipped-below-materiality, plus any schedule that does not roll"}
    never:
      - "Invent an amount when the basis is missing — ask instead."
    upstream: {local: "~/.claude/skills/accruals"}
    license: proprietary-mosofin
    mirror: false
    last_graded: "2026-09-18"
    status: GRADED

  - id: tie-out
    title: Tie-Out
    origin: mosofin-workspace
    authority: first-party
    stage: 5
    summary: >-
      Ties every balance-sheet account to a source — subledger, statement, or schedule —
      and produces a green/red schedule. The close's backbone: red until tied.
    tiers: [READ-ONLY, DETERMINISTIC-MATH, TIE-CHECKED, MATERIALITY-AWARE, HUMAN-APPROVAL, AUDIT-TRAIL]
    tier_notes:
      TIE-CHECKED: "Cross-foots assets = liabilities + equity first; stops if that fails. Then one computed comparison per account."
      READ-ONLY: "Corrections become JE drafts and a pointer to /accruals — never posted from here."
      MATERIALITY-AWARE: "Red rows above materiality keep the close task red; accepted exceptions need a recorded why."
    systems: [quickbooks, csv]
    inputs:
      - {name: "ledger.balance-sheet", required: true, source: "integration manifest", fallback: "balance sheet export as of period end"}
      - {name: "ar.aging", required: false, source: "integration manifest", fallback: "A/R aging export"}
      - {name: "ap.aging", required: false, source: "integration manifest", fallback: "A/P aging export"}
      - {name: "ledger.gl-detail", required: false, source: "integration manifest", fallback: "ask for detail on accounts needing composition analysis"}
      - {name: "prior close artifacts", required: false, source: "closes/<YYYY-MM>/ — bank-rec proofs, amortization schedules", fallback: "redo the work"}
    outputs:
      - {name: "tie-out.md", type: "markdown table", dest: "closes/<YYYY-MM>/ — one row per account: balance, source, difference, status, evidence link"}
      - {name: "headline", type: "chat", dest: "N green, M red, K accepted"}
      - {name: "correction drafts", type: "JE drafts", dest: "chat — with likely cause and recommended fix per red account"}
    never:
      - "Eyeball a difference. Every comparison is scripted."
      - "Post a correcting entry."
    upstream: {local: "~/.claude/skills/tie-out"}
    license: proprietary-mosofin
    mirror: false
    last_graded: "2026-09-18"
    status: GRADED

  - id: je-review
    title: JE Review
    origin: mosofin-workspace
    authority: first-party
    stage: 5
    summary: >-
      The skeptical second pair of eyes on everything posted this period — round
      numbers, unusual account pairings, entries above materiality without support,
      broken reversal patterns, back-dated postings, related-party entries.
    tiers: [READ-ONLY, DETERMINISTIC-MATH, TIE-CHECKED, MATERIALITY-AWARE, HUMAN-APPROVAL, POLICY-CAPTURING, AUDIT-TRAIL]
    tier_notes:
      TIE-CHECKED: "Cross-foots debits = credits per entry and in aggregate first; an unbalanced export stops the review."
      READ-ONLY: "Drafts correcting entries on request; never posts from here."
    systems: [quickbooks, csv]
    inputs:
      - {name: "ledger.gl-detail", required: true, source: "integration manifest", fallback: "GL detail / journal report export for the period"}
      - {name: "MATERIALITY.md", required: false, source: "client workspace", fallback: "ask once"}
      - {name: "COA.md", required: false, source: "client workspace — pairing warnings", fallback: "flag pairings with no precedent in the ledger"}
      - {name: "PROFILE.md", required: false, source: "client workspace — related-party watch-outs", fallback: "skip the same-preparer sensitivity scan"}
    outputs:
      - {name: "flagged entries", type: "chat", dest: "one at a time, ordered by amount, with the flag and a read of what it is probably doing"}
      - {name: "review summary", type: "markdown", dest: "closes/<YYYY-MM>/ — reviewed, flagged by category, resolved vs outstanding"}
      - {name: "correcting entry drafts", type: "JE drafts", dest: "chat, on request"}
      - {name: "decision records", type: "markdown (ADR)", dest: "docs/decisions/ — when a resolution reveals a policy"}
    never:
      - "Post a correcting entry."
    upstream: {local: "~/.claude/skills/je-review"}
    license: proprietary-mosofin
    mirror: false
    last_graded: "2026-09-18"
    status: GRADED

  - id: flux
    title: Flux
    origin: mosofin-workspace
    authority: first-party
    stage: 5
    summary: >-
      Period-over-period variance analysis as a disciplined loop — isolate, drill,
      hypothesise, verify, explain. Commentary is earned from transactions, never
      invented from account names.
    tiers: [READ-ONLY, DETERMINISTIC-MATH, TIE-CHECKED, EVIDENCE-GATED, MATERIALITY-AWARE, HUMAN-APPROVAL, AUDIT-TRAIL]
    tier_notes:
      EVIDENCE-GATED: "Labels each line *explained* (evidence) vs *attributed* (your word). Partial explanations say what remains unexplained."
      TIE-CHECKED: "Explained + unexplained must equal the total period delta, line by line and in total."
      DETERMINISTIC-MATH: "scripts/flux.py computes deltas and percentages and filters by the materiality thresholds."
    systems: [quickbooks, csv]
    inputs:
      - {name: "ledger.pnl-by-month", required: true, source: "integration manifest", fallback: "P&L by month export covering both periods"}
      - {name: "ledger.balance-sheet", required: false, source: "integration manifest", fallback: "P&L flux only"}
      - {name: "ledger.gl-detail", required: false, source: "integration manifest", fallback: "ask about variances that can't be drilled"}
      - {name: "MATERIALITY.md", required: true, source: "client workspace — flux thresholds", fallback: "ask once"}
      - {name: "REPORT-PREFS.md", required: false, source: "client workspace — comparison basis, voice, rounding", fallback: "ask once"}
      - {name: "docs/decisions/", required: false, source: "client workspace", fallback: "a policy change may look like a variance"}
    outputs:
      - {name: "flux commentary", type: "markdown", dest: "closes/<YYYY-MM>/ — per line: what moved, why, whether it recurs"}
      - {name: "variance proof", type: "chat + artifact", dest: "explained + unexplained = total delta, computed"}
      - {name: "misclassification flags", type: "chat", dest: "suggested corrections, not posted"}
    never:
      - "Explain a variance from the account name."
      - "Post a correction found during drilling."
    upstream: {local: "~/.claude/skills/flux"}
    license: proprietary-mosofin
    mirror: false
    last_graded: "2026-09-18"
    status: GRADED

  - id: budget-vs-actuals
    title: Budget vs Actuals
    origin: mosofin-workspace
    authority: first-party
    stage: 6
    summary: >-
      Builds a BvA table with scripted variance math, separates timing from true
      variance, and drafts commentary with the full-year implication computed rather
      than estimated.
    tiers: [READ-ONLY, DETERMINISTIC-MATH, TIE-CHECKED, EVIDENCE-GATED, MATERIALITY-AWARE, HUMAN-APPROVAL, POLICY-CAPTURING, AUDIT-TRAIL]
    tier_notes:
      TIE-CHECKED: "The actuals column must tie to the P&L total for the period, computed. Red until tied."
      DETERMINISTIC-MATH: "scripts/bva.py joins on account and computes variance, %, and favorable/unfavorable by account type. No cell is recomputed by the model."
    systems: [quickbooks, csv]
    inputs:
      - {name: "ledger.pnl-by-month", required: true, source: "integration manifest", fallback: "P&L export for the period(s)"}
      - {name: "budget", required: true, source: "CSV with the same account rows — no live capability yet (`budget.*` reserved)", fallback: "none; account-name mapping recorded once in REPORT-PREFS.md"}
      - {name: "ledger.gl-detail", required: false, source: "integration manifest", fallback: "ask about variances that can't be drilled"}
      - {name: "REPORT-PREFS.md", required: false, source: "client workspace — period, audience, rounding", fallback: "ask once"}
      - {name: "MATERIALITY.md", required: false, source: "client workspace — flux thresholds", fallback: "ask once"}
    outputs:
      - {name: "BvA table", type: "markdown/csv", dest: "closes/<YYYY-MM>/ — period and cumulative columns for YTD"}
      - {name: "commentary", type: "markdown", dest: "closes/<YYYY-MM>/ — over / under / timing / so-what, with run-rate × remaining months computed"}
      - {name: "account mapping", type: "markdown", dest: "REPORT-PREFS.md — recorded once when budget names differ from ledger names"}
      - {name: "decision records", type: "markdown (ADR)", dest: "docs/decisions/ — offered for recurring assumption changes"}
    never:
      - "Recompute a cell the script produced."
    upstream: {local: "~/.claude/skills/budget-vs-actuals"}
    license: proprietary-mosofin
    mirror: false
    last_graded: "2026-09-18"
    status: GRADED

  - id: dashboard
    title: Dashboard
    origin: mosofin-workspace
    authority: first-party
    stage: 6
    summary: >-
      One self-contained HTML file — P&L trends, cash, A/R, KPIs — where every figure
      traces to a source and no figure is computed by the model. Tufte-style restraint,
      inline SVG charts, provenance footer per panel.
    tiers: [READ-ONLY, DETERMINISTIC-MATH, TIE-CHECKED, PROVENANCE-STAMPED, HUMAN-APPROVAL, AUDIT-TRAIL]
    tier_notes:
      PROVENANCE-STAMPED: "Every panel notes source and as-of date; unclosed-period numbers are marked preliminary; build date stamped prominently."
      TIE-CHECKED: "Headline figures must tie to statement totals before the file is written. Red figures get a visible flag or the panel is dropped."
      DETERMINISTIC-MATH: "The model writes the layout, never the numbers."
