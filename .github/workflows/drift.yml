name: drift

# A grade is a claim about one version of a file. This job notices when that
# file changes upstream and asks a human to re-read it. It never re-grades.
#
# Exit codes from scripts/check_drift.py are load-bearing:
#   0  nothing to do, or bookkeeping only
#   1  an upstream SKILL.md changed — a human must re-grade
#   2  an error (link rot, changed licence, rate limit, network)
# They must stay distinct: this workflow once read a rate-limit abort as drift
# and tried to open a re-grading pull request for it.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # The log goes to the runner's temp dir, not the working tree — a stray
      # drift.log in the repo gets picked up and committed by the next step.
      - name: Check pointers against upstream
        id: drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/check_drift.py --write 2>&1 | tee "$RUNNER_TEMP/drift.log"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Rebuild generated docs
        run: python scripts/build.py

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Exit 2 — link rot, an unreadable SKILL.md, a changed LICENCE, or a
      # failure to reach GitHub. Nothing to merge; a person has to look.
      - name: Open an issue on hard failure
        if: steps.drift.outputs.code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Drift check failed $(date -u +%F)" \
            --label "drift" \
            --body "$(printf 'The daily pointer check exited 2.\n\n```\n%s\n```\n' \
                      "$(grep -E '^(FATAL|REGRADE)' "$RUNNER_TEMP/drift.log" || tail -20 "$RUNNER_TEMP/drift.log")")"

      # Exit 1 — an upstream SKILL.md changed, so those entries are now
      # NEEDS-RE-GRADING. This organisation forbids Actions from opening pull
      # requests, so the branch is pushed and an issue asks for the PR.
      - name: Push a re-grading branch and open an issue
        if: steps.drift.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="drift/regrade-$(date -u +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add data/ README.md skills/ connectors/ docs/CONNECTOR-TRACKER.md
          git commit -m "chore(drift): mark changed entries NEEDS-RE-GRADING"
          git push -f origin "$BRANCH"
          gh issue create \
            --title "Re-grading required — upstream SKILL.md changed" \
            --label "needs-re-grading" \
            --body "$(printf 'Branch \`%s\` marks the affected entries NEEDS-RE-GRADING.\n\n```\n%s\n```\n\n**Do not merge this as a formality.** For each entry, open the upstream diff, re-read `SKILL.md`, confirm or correct the trust tiers and the inputs/outputs in its `data/sources/<system>/<id>.yml`, set `status: GRADED` with today `last_graded`, then run `make build`.\n\nSee docs/TRUST-TIERS.md, section "The re-grading rule".\n' \
                      "$BRANCH" "$(grep '^REGRADE' "$RUNNER_TEMP/drift.log" || true)")"

      # Exit 0 — only sibling files moved, or nothing at all. Bookkeeping only.
      - name: Commit bookkeeping
        if: steps.drift.outputs.code == '0'
        run: |
          git add data/ README.md skills/ connectors/ docs/CONNECTOR-TRACKER.md
          git diff --staged --quiet || git commit -m "chore(drift): refresh upstream SHAs"
          git push
