    lead_time: "1–3 weeks, two independent queues"
    payouts: n/a
    note: >-
      Business Verification and App Review are separate queues — file both in
      week 1. No refresh token: renew at ~50 days and alert on failure, or the
      customer re-authorises by hand. Needs ads_read at Advanced Access.
    github_org: facebook
    skills_repo: none
    skills_published: 0
    skills_indexed: 0
