# The consolidated Mosofin connector candidate list.
#
# Two sources, deliberately kept apart by the `source` field:
#   runbook — Connector App Registration (verified 2026-09-06). The committed
#             roadmap: what is live, what is being filed, with connector_key,
#             entity, token strategy and lead time. Authoritative.
#   survey  — Vertical Connector Survey (researched 2026-09-08). The evaluated
#             pool: platforms assessed but not yet committed to.
#
# A skill is only as useful as the data it can reach, so every skill page states
# the reachability of the systems it needs beside its grade.
#
# `make add` only ever appends to sources.yml, so this file stays separate.

meta:
  sources:
    runbook:
      title: "Connector App Registration"
      url: "https://claude.ai/artifact/QuroGDp5nbNQfGGPJGFYHD"
      verified: "2026-09-06"
    survey:
      title: "Vertical Connector Survey"
      url: "https://claude.ai/artifact/2vuysmUi7A59t7dXiVuzNA"
      verified: "2026-09-08"
  caveat: >-
    Re-verify before filing — vendors change auth models, and several on this
    list changed within the year before research.

# Who issues the credential — the fact that decides build cost.
auth_models:
  oauth3: "Three-legged OAuth — the merchant clicks Approve. A real connector."
  merchant-keys: "Merchant generates credentials and pastes them to us. Workable, never pleasant."
  partner-gated: "A signed agreement precedes technical access. Business development, not engineering."
  client-credentials: "Our app authenticates as itself; access provisioned out-of-band."
  none: "No public API."

statuses:
  live: "Connected today"
  code-complete: "Built; blocked on credentials or review, not engineering"
  roadmap: "Committed — registration runbook written"
  candidate: "Evaluated, not yet committed"
  costly: "Reachable only at material cost"
  gated: "Partner agreement required before technical evaluation"
  not-recommended: "Assessed and advised against"
  declined: "Deliberately not pursued"
  local: "Not a connector — files or destinations"

# Family A = one account per grant. Family B = one grant, many entities behind a picker.
connectors:

  # ===== Live =============================================================
  quickbooks:
    status: live
    family: A
    source: runbook
    auth: oauth3
    vertical: accounting
    connector_key: quickbooks
    entity: "Company — realm_id"
    token: "1 h access / 100 d refresh (REFRESH)"
    payouts: n/a
    note: >-
      realm_id is not globally unique; uniqueness is (tenant, connector_key,
      external_datasource_id). Every other connector inherits this rule.
    github_org: intuit
    skills_repo: intuit/quickbooks-claude-plugin
    skills_published: 10
    skills_license: apache-2.0
    skills_indexed: 10
    skills_checked: "2026-09-20"
  stripe:
    status: live
    family: A
    source: runbook
    auth: oauth3
    vertical: payments
    connector_key: stripe
    entity: "Account — acct_…"
    token: "Never expires (STATIC)"
    payouts: "yes"
    note: >-
      read_only scope needs Stripe approval; currently authorising read_write
      and never writing. Prod should launch on read_only.
    github_org: stripe
    skills_repo: stripe/ai
    skills_published: 60
    skills_license: mit
    skills_indexed: 2
    skills_checked: "2026-09-20"

  # ===== Built, awaiting review ===========================================
  shopify:
    status: code-complete
    family: A
    source: runbook
    auth: oauth3
    vertical: ecommerce
    connector_key: shopify
    entity: "Store — shop_domain"
    token: "Never expires (STATIC)"
    lead_time: "2–6 weeks review"
    payouts: conditional
    note: >-
      read_all_orders must be requested or the API silently caps order history
      at 60 days, breaking close and rec. Payout objects populate only for
      merchants on Shopify Payments. Public distribution is irreversible.
    github_org: Shopify
    skills_repo: Shopify/Shopify-AI-Toolkit
    skills_published: 22
    skills_license: mit
    skills_indexed: 1
    skills_checked: "2026-09-20"

