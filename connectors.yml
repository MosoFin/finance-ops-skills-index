# The consolidated Mosofin connector candidate list.
#
# Two sources, deliberately kept apart by the `source` field:
#   runbook — Connector App Registration (verified 2026-09-06). The committed
#             roadmap: what is live, what is being filed, with connector_key,
#             entity, token strategy and lead time. Authoritative.
#   survey  — Vertical Connector Survey (researched 2026-09-08). The evaluated
#             pool: platforms assessed but not yet committed to.
#
# A skill is only as useful as the data it can reach, so every skill page states
# the reachability of the systems it needs beside its grade.
#
# `make add` only ever appends to sources.yml, so this file stays separate.

meta:
  sources:
    runbook:
      title: "Connector App Registration"
      url: "https://claude.ai/artifact/QuroGDp5nbNQfGGPJGFYHD"
      verified: "2026-09-06"
    survey:
      title: "Vertical Connector Survey"
      url: "https://claude.ai/artifact/2vuysmUi7A59t7dXiVuzNA"
      verified: "2026-09-08"
  caveat: >-
    Re-verify before filing — vendors change auth models, and several on this
    list changed within the year before research.

# Who issues the credential — the fact that decides build cost.
auth_models:
  oauth3: "Three-legged OAuth — the merchant clicks Approve. A real connector."
  merchant-keys: "Merchant generates credentials and pastes them to us. Workable, never pleasant."
  partner-gated: "A signed agreement precedes technical access. Business development, not engineering."
  client-credentials: "Our app authenticates as itself; access provisioned out-of-band."
  none: "No public API."

statuses:
  live: "Connected today"
  code-complete: "Built; blocked on credentials or review, not engineering"
  roadmap: "Committed — registration runbook written"
  candidate: "Evaluated, not yet committed"
  costly: "Reachable only at material cost"
  gated: "Partner agreement required before technical evaluation"
  not-recommended: "Assessed and advised against"
  declined: "Deliberately not pursued"
  local: "Not a connector — files or destinations"

# Family A = one account per grant. Family B = one grant, many entities behind a picker.
connectors:

  # ===== Live =============================================================
  quickbooks:
    status: live
    family: A
    source: runbook
    auth: oauth3
    vertical: accounting
    connector_key: quickbooks
    entity: "Company — realm_id"
    token: "1 h access / 100 d refresh (REFRESH)"
    payouts: n/a
    note: >-
      realm_id is not globally unique; uniqueness is (tenant, connector_key,
      external_datasource_id). Every other connector inherits this rule.
  stripe:
    status: live
    family: A
    source: runbook
    auth: oauth3
    vertical: payments
    connector_key: stripe
    entity: "Account — acct_…"
    token: "Never expires (STATIC)"
    payouts: "yes"
    note: >-
      read_only scope needs Stripe approval; currently authorising read_write
      and never writing. Prod should launch on read_only.

  # ===== Built, awaiting review ===========================================
  shopify:
    status: code-complete
    family: A
    source: runbook
    auth: oauth3
    vertical: ecommerce
    connector_key: shopify
    entity: "Store — shop_domain"
    token: "Never expires (STATIC)"
    lead_time: "2–6 weeks review"
    payouts: conditional
    note: >-
      read_all_orders must be requested or the API silently caps order history
      at 60 days, breaking close and rec. Payout objects populate only for
      merchants on Shopify Payments. Public distribution is irreversible.

  # ===== Committed roadmap ================================================
  meta-ads:
    status: roadmap
    family: B
    source: runbook
    auth: oauth3
    vertical: advertising
    connector_key: meta_ads
    entity: "Ad account — act_<id>"
    token: "60 d, no refresh token (EXCHANGE)"
    lead_time: "1–3 weeks, two independent queues"
    payouts: n/a
    note: >-
      Business Verification and App Review are separate queues — file both in
      week 1. No refresh token: renew at ~50 days and alert on failure, or the
      customer re-authorises by hand. Needs ads_read at Advanced Access.
  google-ads:
    status: roadmap
    family: B
    source: runbook
    auth: oauth3
    vertical: advertising
    connector_key: google_ads
    entity: "Customer — 10-digit customer_id"
    token: "1 h access; refresh non-expiring once published"
    lead_time: "Explorer often instant; Basic ~5 days"
    payouts: n/a
    note: >-
      Explorer tier covers production accounts with no review, so this need not
      block on approval. While the consent screen is in Testing, refresh tokens
      expire after 7 days — publish before debugging. Separate Cloud projects
      for dev and prod are Google policy, not preference.
  square:
    status: roadmap
    family: A
    source: runbook
    auth: oauth3
    vertical: payments
    connector_key: square_payments
    entity: "Merchant — merchant_id"
    token: "30 d access; non-expiring refresh (confidential client)"
    lead_time: "Sandbox instant"
    payouts: "yes"
    note: >-
      Entity is the merchant, never the location — locations are a reporting
      dimension, or every store burns a quota seat. One connector covers
      restaurants, retail and dry cleaning. Marketplace listing not required.
  paypal:
    status: roadmap
    family: A
    source: runbook
    auth: oauth3
    vertical: payments
    connector_key: paypal
    entity: "Merchant — payer_id"
    token: "8 h access + refresh (REFRESH)"
    lead_time: "None — self-serve"
    payouts: "yes"
    note: >-
      Log in with PayPal, not Partner Referrals — the latter creates new seller
      accounts. Transaction Search must be ticked or the scope is silently
      absent from the granted token.
  xero:
    status: roadmap
    family: B
    source: runbook
    auth: oauth3
    vertical: accounting
    connector_key: xero
    entity: "Organisation — tenantId"
    token: "30 min access / 60 d refresh, rotating"
    lead_time: "Self-serve"
    payouts: n/a
    note: "Rotating refresh tokens need atomic persistence — a lost write costs the grant."
  hubspot:
    status: roadmap
    family: A
    source: runbook
    auth: oauth3
    vertical: crm
    connector_key: hubspot
    entity: "Portal — hub_id"
    token: "30 min access + refresh (REFRESH)"
    lead_time: "Self-serve"
    payouts: n/a
    note: >-
      Legacy public app creation was disabled in 2026 — new public apps require
      the Projects-based platform via the HubSpot CLI. The only connector here
      needing a CLI workflow rather than a dashboard registration.
  klaviyo:
    status: roadmap
    family: A
    source: runbook
    auth: oauth3
    vertical: marketing
    connector_key: klaviyo
    entity: "Klaviyo account"
    token: "1 h access; refresh non-rotating, dies at 90 d idle"
    lead_time: "Self-serve; review only to be listed"
    payouts: n/a
  amazon-sp:
    status: roadmap
    family: A
    source: runbook
    auth: oauth3
    vertical: ecommerce
    connector_key: amazon_sp
    entity: "Selling partner / merchant id"
    token: "LWA access + refresh (REFRESH)"
    lead_time: "Weeks–months"
    payouts: "yes"
    note: "Longest lead time on the roadmap — file first, build while the clock runs."

  # ===== Evaluated, not committed =========================================
  bigcommerce:
    status: candidate
    family: A
    source: survey
    auth: oauth3
    vertical: ecommerce
    payouts: "yes"
    note: "Survey priority 2 — cleanest registration found; mirrors the Shopify code."
  ebay:
    status: candidate
    family: A
    source: survey
    auth: oauth3
    vertical: ecommerce
    payouts: "yes"
    note: "Finances API exposes payouts, fees and refunds outright."
  ecwid:
    status: candidate
    family: A
    source: survey
    auth: oauth3
    vertical: ecommerce
    payouts: partial
  lightspeed-x:
    status: candidate
    family: A
    source: survey
    auth: oauth3
    vertical: ecommerce
    payouts: partial
    note: "Rotating refresh tokens — same atomic-persistence care as Xero."
  etsy:
    status: candidate
    family: A
    source: survey
    auth: oauth3
    vertical: ecommerce
    payouts: "yes"
    note: "Two sequential review queues — file the Personal App early."
  clio:
    status: candidate
    family: A
    source: survey
    auth: oauth3
    vertical: professional
    payouts: n/a
    note: "Survey priority 3. Two separate APIs — confirm which carries billing."
  harvest:
    status: candidate
    family: A
    source: survey
    auth: oauth3
    vertical: professional
    payouts: n/a
  jobber:
    status: candidate
    family: A
    source: survey
    auth: oauth3
    vertical: fieldservice
    payouts: n/a
    note: >-
      Survey priority 4. Field service has no processor fallback — embedded
      payments mean the platform API is the only path to the money. GraphQL only.
  servicem8:
    status: candidate
    family: A
    source: survey
    auth: oauth3
    vertical: fieldservice
    payouts: n/a

  # ===== Reachable only at cost ===========================================
  woocommerce:
    status: costly
    family: A
    source: runbook
    auth: merchant-keys
    vertical: ecommerce
    entity: "Store URL — no vendor-issued id"
    token: "ck_… / cs_… (STATIC)"
    payouts: partial
    note: "No registration exists and no revocation signal. Per-merchant key entry."
  servicetitan:
    status: costly
    family: A
    source: survey
    auth: merchant-keys
    vertical: fieldservice
    payouts: n/a
    note: "The contractor generates the credentials — the WooCommerce pattern again."
  housecallpro:
    status: costly
    family: A
    source: survey
    auth: merchant-keys
    vertical: fieldservice
    payouts: n/a
    note: "Merchant must be on the MAX plan ($299+/mo) before connecting."
  clover:
    status: costly
    family: A
    source: survey
    auth: oauth3
    vertical: retail
    payouts: none
    note: "One merchantId and one token per location — a five-store chain is five grants."

  # ===== Gated, advised against, declined =================================
  toast:
    status: gated
    family: none
    source: survey
    auth: client-credentials
    vertical: restaurants
    payouts: n/a
    note: "No consent screen and no redirect flow. Business development, not engineering."
  ncr-voyix:
    status: gated
    family: none
    source: survey
    auth: partner-gated
    vertical: retail
    payouts: partial
  gmail:
    status: not-recommended
    family: none
    source: runbook
    auth: oauth3
    vertical: workspace
    entity: "Google account"
    token: "1 h access + refresh"
    payouts: n/a
    note: >-
      Restricted scope triggers a CASA Tier 2 assessment — $540–1,800/yr,
      re-assessed annually and indefinitely. The obligation does not shrink if
      the connector proves unpopular.
  ehr:
    status: declined
    family: none
    source: survey
    auth: partner-gated
    vertical: medical
    payouts: n/a
    note: >-
      PHI means a BAA with every practice, plus HIPAA audit logging and breach
      obligations that outlive the connector. Connect the processor and the
      ledger instead.

  # ===== Destinations and files ===========================================
  google-sheets:
    status: local
    family: none
    source: runbook
    auth: oauth3
    vertical: destination
    payouts: n/a
    note: "Destination. drive.file scope only — non-sensitive, no review. Deferred to roadmap §5.2."
  excel:
    status: local
    family: none
    source: runbook
    auth: oauth3
    vertical: destination
    payouts: n/a
    note: "Destination. Graph delegated permissions, not application. Deferred to roadmap §5.2."
  google-drive: {status: local, family: none, source: runbook, auth: oauth3, vertical: destination, payouts: n/a}
  csv:         {status: local, family: none, source: runbook, auth: none, vertical: files, payouts: n/a}
  pdf:         {status: local, family: none, source: runbook, auth: none, vertical: files, payouts: n/a}
  word:        {status: local, family: none, source: runbook, auth: none, vertical: files, payouts: n/a}
  powerpoint:  {status: local, family: none, source: runbook, auth: none, vertical: files, payouts: n/a}
  images:      {status: local, family: none, source: runbook, auth: none, vertical: files, payouts: n/a}
  any:         {status: local, family: none, source: runbook, auth: none, vertical: files, payouts: n/a}
