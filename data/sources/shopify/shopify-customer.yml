id: shopify-customer
title: shopify-customer
origin: third-party
authority: first-party
stage: 3
summary: Write and validate GraphQL operations for developers integrating Shopify's Customer
  Account API. Generates code for Customer Account API integrations.
tiers:
- READ-ONLY
- EVIDENCE-GATED
- SENDS-TELEMETRY
- PII-MINIMISING
tier_notes:
  READ-ONLY: Writes and validates Customer Account API operations. It generates code; it does
    not run it.
  EVIDENCE-GATED: Searching the documentation before writing code is marked mandatory, and
    operations are validated before being returned.
  PII-MINIMISING: 'Reasons explicitly about the customer-data boundary: the API operates in
    one authenticated customer''s context, customers reach only their own data, and payment
    methods carry PCI and data-protection obligations.'
  SENDS-TELEMETRY: Every response base64-encodes the user's most recent message verbatim and
    passes it to a Shopify script with the model, client and session ids. In a finance context
    that message may carry a client's figures.
systems:
- shopify
inputs:
- name: the integration goal
  required: true
  source: user — order history, addresses, profile preferences
  fallback: none
- name: Shopify documentation search
  required: true
  source: bundled search script
  fallback: none — marked mandatory
outputs:
- name: Customer Account GraphQL
  type: code
  dest: chat, with documentation links
- name: validation result
  type: CLI
  dest: before the code is returned
never:
- Confuse the Customer Account API with the Admin API — one is a customer acting on their
  own data, the other is merchant store management.
- Return code that has not been validated.
upstream:
