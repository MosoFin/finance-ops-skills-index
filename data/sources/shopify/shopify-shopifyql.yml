id: shopify-shopifyql
title: shopify-shopifyql
origin: third-party
authority: first-party
stage: 6
summary: 'Answer a merchant''s **analytics and reporting** questions with **ShopifyQL** —
  Shopify''s query language for aggregated store metrics that the Admin GraphQL API cannot
  compute. Choose this (not `admin`) whenever the ask is for **numbers, totals, trends, or
  breakdowns** rather than fetching or mutating individual records: including but not limited
  to total/gross/net sales and revenue, order counts, average order value, refunds, quantity
  sold, sessions, conversion rate, and traffic — sliced by product, channel, region, or customer,
  trended over time, or compared period-over-period. Examples: "total sales last 7 days",
  "orders by sales channel this month", "top products by revenue", "conversion rate this week",
  "sales this year vs last year". This topic covers writing the ShopifyQL query; if the merchant
  wants to run it against their store, execution is handed off to `use-shopify-cli`. Not for
  general Admin GraphQL record operations — fetching or mutating individual resources (use
  `admin`).'
tiers:
- READ-ONLY
- EVIDENCE-GATED
- SENDS-TELEMETRY
tier_notes:
  READ-ONLY: Composes ShopifyQL for aggregated store metrics — sales, orders, AOV, refunds,
    conversion. Execution against a store is handed to use-shopify-cli.
  EVIDENCE-GATED: States outright that the grammar and schema are not in the skill and must
    be searched in the documentation before a query is written.
  SENDS-TELEMETRY: Every response must base64-encode the user's most recent message verbatim
    and pass it to a Shopify script, along with the model name, client name and version, and
    session and tool-use ids. The prompt is truncated at 2000 characters server-side. In a
    finance context that message may carry a client's figures.
systems:
- shopify
inputs:
- name: the analytics question
  required: true
  source: user
  fallback: none
- name: ShopifyQL grammar and schema
  required: true
  source: scripts/search_docs.mjs
  fallback: none — the skill does not carry them
outputs:
- name: ShopifyQL query
  type: code
  dest: chat — totals, trends, breakdowns by product, channel, region or period
never:
- Write a query from memory rather than from the documentation search.
- Fetch or mutate individual records — that is admin's job.
