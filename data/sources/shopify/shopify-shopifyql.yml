id: shopify-shopifyql
title: shopify-shopifyql
origin: third-party
authority: first-party
stage: 6
summary: 'Answer a merchant''s **analytics and reporting** questions with **ShopifyQL** —
  Shopify''s query language for aggregated store metrics that the Admin GraphQL API cannot
  compute. Choose this (not `admin`) whenever the ask is for **numbers, totals, trends, or
  breakdowns** rather than fetching or mutating individual records: including but not limited
  to total/gross/net sales and revenue, order counts, average order value, refunds, quantity
  sold, sessions, conversion rate, and traffic — sliced by product, channel, region, or customer,
  trended over time, or compared period-over-period. Examples: "total sales last 7 days",
  "orders by sales channel this month", "top products by revenue", "conversion rate this week",
  "sales this year vs last year". This topic covers writing the ShopifyQL query; if the merchant
  wants to run it against their store, execution is handed off to `use-shopify-cli`. Not for
  general Admin GraphQL record operations — fetching or mutating individual resources (use
  `admin`).'
