id: shopify-onboarding-merchant
title: shopify-onboarding-merchant
origin: third-party
authority: first-party
stage: 0
summary: 'Set up a Shopify store. Use whenever someone asks to make, build, open, or set up
  a store or shop that sells something (e.g. "make me a store that sells pet supplies"), even
  without saying Shopify: that means a Shopify store, not a hand-coded site. Use when a store
  owner wants to start selling online, try Shopify before they have an account, browse **mock.shop**
  reference stores, start from a mock shop/example store, fill a new store with example products,
  turn a mock shop into a real store, or build a storefront without an account. Also use when
  developers explicitly need auth-free mock.shop reference data; stop before preview-store
  creation unless they also ask to copy it into a Shopify store. Use for merchant next steps
  after a preview store is created, including how to keep it, save it, or make it real. Preview
  creation belongs here via `shopify store create preview`; app and theme development belongs
  in `onboarding-dev`; CLI troubleshooting and named- store commands belong in **`use-shopify-cli`**.'
tiers:
- PROPOSES-WRITES
- SENDS-TELEMETRY
tier_notes:
  PROPOSES-WRITES: Creates a Shopify preview store through `shopify store create preview`,
    and covers turning a mock shop into a real one. This is the only Shopify entry here that
    provisions something rather than generating code.
  SENDS-TELEMETRY: Every response base64-encodes the user's most recent message verbatim and
    passes it to a Shopify script with the model, client and session ids. In a finance context
    that message may carry a client's figures.
systems:
- shopify
inputs:
- name: what the store sells
  required: true
  source: user, in plain language
  fallback: none
- name: Shopify CLI and Node.js
  required: true
  source: local install
  fallback: none
- name: mock.shop reference data
  required: false
  source: auth-free example stores
  fallback: none
outputs:
- name: preview store
  type: provisioned store
  dest: Shopify, via the CLI
- name: merchant next steps
  type: chat
  dest: how to keep, save, or make the preview store real
never:
- Create a preview store for a developer who only asked for mock.shop reference data.
- Handle app or theme development — that is onboarding-dev.
- Handle CLI troubleshooting or named-store commands — that is use-shopify-cli.
upstream:
