id: amz-stockout-prevention
title: Amazon stockout prevention
kind: skill
origin: third-party
authority: first-party
stage: 7
summary: 'Amazon''s own skill for FBA inventory health: days of cover from sales velocity, inbound-shipment
  gaps and restocking, with any price change drafted for the seller to approve.'
tiers:
- PROPOSES-WRITES
- HUMAN-APPROVAL
tier_notes:
  PROPOSES-WRITES: Can draft a listing price change; it runs a validation preview first and never executes
    silently.
  HUMAN-APPROVAL: Waits for the seller to type "approve" before applying a drafted change.
systems:
- amazon-sp
inputs:
- name: Amazon Selling Partner connector (Seller Central OAuth)
  required: true
  source: sellingpartner-ai.amazon.com/mcp
  fallback: none
outputs:
- name: stockout risks and drafted actions
  type: chat
  dest: the conversation
never:
- Apply a price change without the seller's approval.
