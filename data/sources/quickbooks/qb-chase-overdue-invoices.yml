id: qb-chase-overdue-invoices
title: chase-overdue-invoices
origin: third-party
authority: first-party
stage: 3
summary: Send payment reminders for invoices with tone matched to aging. ALWAYS use this skill
  when the user asks to "send a reminder", "send reminder to invoice", "remind about invoice",
  "send a reminder to invoice 1234", "remind them about 4574", "send a firmer reminder for
  invoice 1042", "who owes me money", "show me overdue invoices", "chase down overdue invoices",
  "follow up on unpaid invoices", or "nudge customers who haven't paid". This skill MUST be
  loaded before calling qbo_sales_send_invoice_reminder to ensure confirmation and tone- matching.
tiers:
- SENDS-EXTERNALLY
- HUMAN-APPROVAL
- EVIDENCE-GATED
tier_notes:
  SENDS-EXTERNALLY: 'This skill transmits email to the client''s customers. It is the clearest
    contrast in the index: Mosofin''s aging-review drafts collections notes and stops, while
    this one sends them.'
  HUMAN-APPROVAL: A confirmation showing the exact subject and body is required before every
    send, and approval does not carry across a changed set — 'Never auto-send' is stated as
    a hard rule.
  EVIDENCE-GATED: Invoice facts come from tool calls, never memory. Tone edits may change
    wording but never amount, balance, due date or terms, and a hold for a pending bank match
    must be reported as *may* be paid, never as paid.
systems:
- quickbooks
inputs:
- name: qbo_accounting_get_ar_aging_summary_text
  required: false
  source: QuickBooks connector
  fallback: one scoped qbo_sales_get_invoices call; ask the user to narrow rather than paging
    the ledger
- name: qbo_sales_get_invoices
  required: true
  source: QuickBooks connector — resolves a named invoice via doc_numbers
  fallback: none
- name: qbo_sales_get_settings (reminder_template)
  required: true
  source: QuickBooks connector — mandatory before any bulk send
  fallback: tell the user the template could not be retrieved; still show the full invoice
    list
- name: user confirmation
  required: true
  source: an explicit yes, per set and per wording
  fallback: none — nothing sends without it
outputs:
- name: prioritised chase list
  type: chat
  dest: ranked 91+ first, then by balance, invoice numbers rendered as links
- name: reminder emails
  type: email to the customer
  dest: sent through QuickBooks after confirmation; tone matched to the aging bucket for a
    single invoice, merchant template for bulk
- name: send result
  type: chat
  dest: sent and failed counts; held invoices are never reported as sent
never:
- Auto-send. Every send waits for an explicit yes on the current set and current text.
- Pass custom subject or body on a bulk send — the tool rejects it.
- State that an invoice IS paid when a pending bank match is flagged.
- Let a tone edit change an amount, balance, due date or terms.
- Give legal or collections advice.
