id: expense-report-processor
title: Expense Report Processor
origin: mosofin-published
authority: first-party
stage: 2
summary: Processes T&E expense reports from Concur, Expensify, Brex, Pleo and others — codes
  against the real chart of accounts, matches claims against already-posted transactions,
  and checks reimbursement and card-clearing balances.
tiers:
- READ-ONLY
- EVIDENCE-GATED
- PROVENANCE-STAMPED
- HUMAN-APPROVAL
- AUDIT-TRAIL
- PII-MINIMISING
tier_notes:
  READ-ONLY: Absolute, and stronger than a default. Write tools stay out of scope even when
    the connection's effective_policy enables them — 'a permission to write is not an instruction
    to write'. A step that would need a write becomes a manual task with the artefact handed
    to a person, said plainly in the output so nobody assumes it was done. The GL posting
    it builds is a proposal.
  EVIDENCE-GATED: Codes against the real chart of accounts, matches claims against transactions
    already posted, and checks the reimbursement and card-clearing balances rather than assuming
    the report is self-consistent.
  PII-MINIMISING: Handles employee expense data and never prints internal tenant identifiers.
  PROVENANCE-STAMPED: 'Ends with a Data sources line naming the calls and their retrieval
    time, and carries a coverage sheet: one row per task with its verdict (auto, gated or
    manual), the tool used, the policy, whether any figure rests on mock data, and the named
    gap for anything unverified.'
systems:
- quickbooks
- csv
inputs:
- name: expense report export
  required: true
  source: Concur, Expensify, Brex, Pleo, Spendesk, Soldo or any T&E tool
  fallback: a pasted report
- name: live chart of accounts
  required: true
  source: the connected accounting datasource
  fallback: coding becomes a named gap
- name: expense policy
  required: false
  source: user or entity profile
  fallback: policy validation is a named gap
outputs:
- name: policy-validated report
  type: table
  dest: per claim, with exceptions flagged
- name: proposed GL posting
  type: entry
  dest: coded, with reimbursement and card-clearing amounts computed
- name: coverage sheet
  type: table
  dest: per task verdict, tool, policy and gap
never:
- Post the reimbursement or the GL entry.
- Handle vendor invoices or petty cash — those are separate skills.
