id: qb-payroll-employee-onboarding
title: payroll-employee-onboarding
origin: third-party
authority: first-party
stage: 4
summary: Onboard a new hire into QuickBooks Payroll from user-provided details or onboarding
  source files such as offer letters and employee rosters. Use when the user wants to add
  a new payroll employee, onboard a new employee so they can be paid, deduplicate a new hire
  before creation, assign an existing payroll work location, set initial contract/base pay
  during onboarding, or review payroll-readiness gaps. Requires confirmation before write
  actions and reports remaining setup to finish in QuickBooks Payroll. Do not use for existing-employee
  pay changes outside onboarding, payroll runs, taxes, direct deposit, benefits, deductions,
  time off, or compliance advice.
tiers: []
systems:
- quickbooks
