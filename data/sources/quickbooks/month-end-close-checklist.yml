id: month-end-close-checklist
title: Month-End Close Checklist
origin: mosofin-published
authority: first-party
stage: 1
summary: Plans, runs, or audits a monthly close against a Mosofin workspace — scopes the checklist
  from the entity's actual chart of accounts, pre-populates the status of every task that
  leaves ledger evidence, and runs a final tie-out including inter-period continuity.
tiers:
- READ-ONLY
- TIE-CHECKED
- MATERIALITY-AWARE
- EVIDENCE-GATED
- PROVENANCE-STAMPED
- HUMAN-APPROVAL
- AUDIT-TRAIL
- STATEFUL
tier_notes:
  READ-ONLY: Absolute, and stronger than a default. Write tools stay out of scope even when
    the connection's effective_policy enables them — 'a permission to write is not an instruction
    to write'. A step that would need a write becomes a manual task with the artefact handed
    to a person, said plainly in the output so nobody assumes it was done.
  TIE-CHECKED: Ends in a tie-out workpaper at close, including inter-period continuity, rather
    than a checklist of ticked boxes.
  MATERIALITY-AWARE: Carries its own materiality and risk step, so tasks are weighted rather
    than treated alike.
  STATEFUL: Tracks open items and review notes across the close, and pre-populates the status
    of every task that leaves ledger evidence rather than asking.
  EVIDENCE-GATED: A gap is named, never estimated. Where data does not cover something the
    skill names the tool that would have covered it, and a task with no tool becomes a manual
    task with a named gap rather than a dropped task.
  PROVENANCE-STAMPED: 'Ends with a Data sources line naming the calls and their retrieval
    time, and carries a coverage sheet: one row per task with its verdict (auto, gated or
    manual), the tool used, the policy, whether any figure rests on mock data, and the named
    gap for anything unverified.'
systems:
- quickbooks
inputs:
- name: the entity's chart of accounts
  required: true
  source: the connected accounting datasource — the checklist is scoped from it
  fallback: a generic checklist, with the gap named
- name: ledger evidence per task
  required: false
  source: the datasource, to pre-populate status
  fallback: ask the owner
- name: owners and deadlines
  required: true
  source: user
  fallback: ask
outputs:
- name: close checklist
  type: table
  dest: tasks with owners, deadlines, dependencies and pre-populated status
- name: tie-out workpaper
  type: document
  dest: at close, including inter-period continuity
- name: open items and review notes
  type: table
  dest: tracked through the close
- name: coverage sheet
  type: table
  dest: per task verdict, tool, policy and gap
never:
- Perform an individual close task — a specific reconciliation, accrual or entry belongs to
  its own skill.
- Mark a task complete on anything but evidence.
