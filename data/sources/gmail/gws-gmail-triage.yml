id: gws-gmail-triage
title: Gmail triage (gws-gmail-triage)
origin: third-party
authority: first-party
stage: 3
summary: Google's official Gmail triage skill. Pairs with aging-review, where the collections
  follow-up and the client's reply both arrive by mail.
tiers:
- READ-ONLY
tier_notes:
  READ-ONLY: States it plainly — never modifies the mailbox. It lists unread mail; it does
    not label, archive or reply.
systems:
- gmail
inputs:
- name: --query
  required: false
  source: Gmail search syntax
  fallback: is:unread
- name: --max
  required: false
  source: user
  fallback: '20'
outputs:
- name: inbox summary
  type: table or JSON
  dest: sender, subject, date, optionally labels
never:
- Modify the mailbox.
- Auth and security rules live in ../gws-shared/SKILL.md, which is not indexed here. The grade
  covers this file only; the safety rules it defers to are unreviewed.
upstream:
  repo: googleworkspace/cli
  path: skills/gws-gmail-triage
  ref: main
license: apache-2.0
mirror: false
