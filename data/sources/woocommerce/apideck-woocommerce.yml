- name: integration goal
  required: true
  source: user
  fallback: none
- name: Apideck API key, app id and consumer id
  required: true
  source: environment variables in generated code
  fallback: none — Apideck is the transport
outputs:
- name: example code and caveats
  type: chat
  dest: chat
