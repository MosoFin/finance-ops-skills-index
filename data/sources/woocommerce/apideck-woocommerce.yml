id: apideck-woocommerce
title: WooCommerce (via Apideck)
origin: third-party
authority: notable
stage: 2
summary: 'Apideck''s guide to reaching WooCommerce through its Ecommerce unified API: orders,
  products, customers and stores, with auth, rate-limit and coverage caveats. Every call routes
  through Apideck, so it needs an Apideck account in addition to WooCommerce access. The WooCommerce
  connector is marked beta by Apideck: expect partial coverage.'
tiers:
- READ-ONLY
tier_notes:
  READ-ONLY: 'A developer reference: it explains the serviceId, entity mapping and caveats
    and shows example code. It runs nothing itself. The code it shows can create records in
    WooCommerce, and the skill gives no confirmation guidance for those writes — that is the
    integrator''s job.'
systems:
- woocommerce
