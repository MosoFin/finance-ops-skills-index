id: paypal-best-practices
title: paypal-best-practices
origin: third-party
authority: first-party
stage: 3
summary: PayPal integration guidance, code examples, and best practices. Use for checkout,
  card fields, BNPL, Pay Later, Venmo, subscriptions, invoicing, disputes, payouts, webhooks,
  APMs, JS SDK v5, JS SDK v6, createInstance, payment sessions, web components, Fastlane,
  payment links, donations, 3D Secure, vaulting, iDEAL, bank redirects, agentic commerce,
  or any PayPal architecture decision or code generation question.
tiers:
- READ-ONLY
- EVIDENCE-GATED
tier_notes:
  READ-ONLY: Architecture and code guidance. Live operations are explicitly handed to the
    PayPal MCP server rather than performed here.
  EVIDENCE-GATED: Requires reading the matching reference file before answering, and asks
    which SDK version is in use rather than assuming. Where three Fastlane variants exist
    it refuses to generate code until the user picks one.
systems:
- paypal
inputs:
- name: integration intent
  required: true
  source: user
  fallback: routed through a table of intents to a reference file
- name: SDK version
  required: true
  source: detected from the project's script tag and API shape
  fallback: v6 for a new project; ask when unclear
- name: project environment files
  required: false
  source: '`.env`, `.env.sample` in root and server/client directories'
  fallback: ask how the client ID is configured before flagging anything missing
outputs:
- name: integration guidance and code
  type: chat
  dest: against the correct SDK version
- name: environment check
  type: chat
  dest: flags missing or empty credentials after the generated code
- name: pre-delivery validation
  type: checklist
  dest: thirteen checks including no hardcoded credentials, sandbox URLs, webhook signature
    verification
never:
- Hardcode credentials in generated code.
- Mix the three Fastlane variants.
- Recommend NVP/SOAP, v1/payments, Hosted Fields or Adaptive Payments.
- Create orders client-side.
- Execute API calls the MCP tools should handle.
upstream:
  repo: paypal/AI-Toolkit
  path: skills/paypal-best-practices
  ref: main
license: apache-2.0
mirror: false
