id: gusto-payroll-prep
title: Gusto payroll prep
kind: skill
origin: third-party
authority: first-party
stage: 4
summary: Gusto's own skill that loads a pay period's hours, tips, commission, bonus and reimbursements
  from your spreadsheet or POS export onto the draft payroll and calculates it for review. It never runs
  payroll; you approve in Gusto.
tiers:
- PROPOSES-WRITES
- HUMAN-APPROVAL
tier_notes:
  PROPOSES-WRITES: 'Writes onto a draft payroll only: "it never processes or submits payroll."'
  HUMAN-APPROVAL: Reviews the column mapping and per-employee values with you before writing, and the
    CLI blocks agent writes until re-run with --confirm.
systems:
- gusto
inputs:
- name: Gusto CLI, signed in (gusto auth login)
  required: true
  source: your Gusto account
  fallback: none
- name: the period's hours and pay inputs
  required: true
  source: a CSV or POS export
  fallback: none
outputs:
- name: calculated draft payroll
  type: chat
  dest: Gusto
never:
- Process or submit payroll.
