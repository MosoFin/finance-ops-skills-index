id: stripe-connect-recommend
title: connect-recommend
origin: third-party
authority: first-party
stage: 3
summary: Use this skill when the user asks about Stripe Connect configuration, charge patterns,
  Dashboard access, or how to get started with Connect, is building a marketplace, platform,
  multi-vendor store, gig platform, or subscription platform, needs to pay out sellers, vendors,
  or providers, mentions split payments, revenue sharing, multi-party payments, or similar
  payment distribution concepts, provides a company URL or business description for a recommendation,
  builds SaaS that routes money between parties (for example, POS, booking, invoicing — not
  operational SaaS without payment routing), asks about onboarding or KYC for merchants, sellers,
  and vendors, mentions connected account Dashboard or responsibility configurations, or asks
  about payment flows, white-label payments, or embedded payments.
tiers:
- READ-ONLY
- HUMAN-APPROVAL
- EVIDENCE-GATED
tier_notes:
  READ-ONLY: Produces a recommendation plan for a Stripe Connect configuration. It changes
    no account setting.
  HUMAN-APPROVAL: Every decision point must be confirmed with numbered options, one question
    at a time. It also draws the line the other way — scanning the codebase, reading references
    and generating the plan are low-cost and never ask permission, so confirmation is spent
    where it matters.
  EVIDENCE-GATED: Requires reading the terminology rules before producing user-facing output,
    and insists configurations be described by their field values — dashboard, fee ownership,
    negative-balance liability, charge pattern — rather than by shorthand codes that hide
    what the platform is taking on.
systems:
- stripe
inputs:
- name: company URL or business description
  required: true
  source: user
  fallback: none — this is the only thing the user must supply
- name: codebase
  required: false
  source: scanned without asking
  fallback: recommendation from the description alone
outputs:
- name: recommendation plan
  type: markdown
  dest: the configuration, described by field values
- name: next actions
  type: chat
  dest: every stopping point ends with concrete options, never passive text
never:
- Use shorthand configuration codes in user-facing output instead of the underlying field
  values.
- Ask permission for a low-cost action such as reading a reference file.
- End a turn without offering the user a next step.
upstream:
  repo: stripe/ai
  path: providers/claude/plugin/skills/connect-recommend
  ref: main
