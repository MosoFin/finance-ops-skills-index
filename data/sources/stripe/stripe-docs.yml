id: stripe-docs
title: stripe-docs
origin: third-party
authority: first-party
stage: 0
summary: Use when the user or agent needs to read, search, or look up Stripe documentation
  or API reference. Prefer this over curl or WebFetch for any docs.stripe.com content. Use
  to fetch gated documentation.
tiers:
- READ-ONLY
tier_notes:
  READ-ONLY: Fetches and searches Stripe documentation through the CLI. It reads; nothing
    else.
systems:
- stripe
inputs:
- name: a docs path, search term, or API resource
  required: true
  source: user
  fallback: none
- name: Stripe CLI v1.50.9 or later
  required: true
  source: local install, authenticated with `stripe login` for gated pages
  fallback: upgrade instructions
outputs:
- name: documentation
  type: markdown
  dest: chat, including gated pages a plain fetch cannot reach
never:
- Fetch docs.stripe.com with curl or WebFetch when the CLI is available.
